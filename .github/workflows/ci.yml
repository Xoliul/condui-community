name: Community CI

on:
  push:
    branches: [master, 'preview/**']
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: community-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Build and container smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Assert Community dependencies match the lockfile
        run: node scripts/assert-community-dependency-compat.mjs --require-exact

      - name: Build Community edition
        run: npm run build

      - name: Build container
        run: docker build --tag condui-community:ci .

      - name: Smoke-test container
        shell: bash
        run: |
          container_id="$(docker run --detach --publish 127.0.0.1:8080:8080 condui-community:ci)"
          cleanup() {
            docker logs "$container_id" || true
            docker stop "$container_id" >/dev/null || true
          }
          trap cleanup EXIT

          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:8080/healthz > health.json; then
              break
            fi
            sleep 1
          done

          grep --fixed-strings '"edition":"community"' health.json
          curl --fail --silent http://127.0.0.1:8080/nl/ | grep --fixed-strings 'id="root"'

          unavailable_status="$(
            curl --silent --output /dev/null --write-out '%{http_code}' \
              --request POST http://127.0.0.1:8080/api/not-available
          )"
          test "$unavailable_status" = "404"

          curl --fail --silent http://127.0.0.1:8080/api/storage | grep --fixed-strings '"enabled":false'

          outside_status="$(
            curl --silent --output /dev/null --write-out '%{http_code}'               --header 'X-Forwarded-For: 203.0.113.7' http://127.0.0.1:8080/
          )"
          test "$outside_status" = "403"

  publish-container:
    name: Publish container
    if: >-
      github.event_name == 'push' &&
      (github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/heads/preview/'))
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve preview name
        id: preview
        shell: bash
        run: |
          if [[ "$GITHUB_REF_NAME" == preview/* ]]; then
            echo "name=${GITHUB_REF_NAME#preview/}" >> "$GITHUB_OUTPUT"
          fi

      - name: Create container metadata
        id: metadata
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/xoliul/condui-community
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/master' }}
            type=raw,value=preview-${{ steps.preview.outputs.name }},enable=${{ steps.preview.outputs.name != '' }}
            type=sha,prefix=sha-,format=long
          labels: |
            org.opencontainers.image.title=Condui Community
            org.opencontainers.image.description=Local, self-hosted Condui Community edition
            org.opencontainers.image.licenses=PolyForm-Perimeter-1.0.1

      - name: Build and publish container
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: true
